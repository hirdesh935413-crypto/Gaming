name: Build GAME TURBO PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Project Structure
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== FILES ====="
          find . -maxdepth 4 -type f | sort
          echo "================"

      - name: Verify Android Project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Android project detected."

      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        if: success()
        run: |
          echo "===== GENERATED APK ====="
          find app/build/outputs -type f -name "*.apk" -print
          echo "========================="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GAME-TURBO-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
