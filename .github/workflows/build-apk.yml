name: Build GAME TURBO PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Project files:"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Found project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        shell: bash
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "===== PROJECT FILES ====="
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort
          echo "========================"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle missing."
            exit 1
          fi

          echo "Android project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find Generated APK
        shell: bash
        run: |
          echo "===== APK ====="
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print
          echo "==============="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GAME-TURBO-PRO-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
